<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Nicht mehr zusammen</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #0b1020;
      --bg-2: #1b1f3a;
      --txt: #f3f4f6;
      --muted: #9ca3af;
      --accent: #f87171;
      --line: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--txt);
      background: radial-gradient(circle at 20% 10%, #243b77 0%, transparent 40%),
                  radial-gradient(circle at 80% 90%, #44214f 0%, transparent 35%),
                  linear-gradient(160deg, var(--bg-1), var(--bg-2));
      padding: 2rem;
    }

    .card {
      width: min(680px, 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(6px);
      background: rgba(17, 24, 39, 0.75);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .code {
      font-size: clamp(3rem, 12vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.04em;
      margin: 0;
      color: var(--accent);
    }

    h1 {
      margin: 1rem 0 0.8rem;
      font-size: clamp(1.2rem, 3vw, 1.9rem);
    }

    p {
      margin: 0.5rem 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }

    .status {
      margin-top: 1.5rem;
      display: inline-block;
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      background: rgba(0, 0, 0, 0.25);
    }

    .status strong { color: #fca5a5; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="headline">
    <p class="code">404</p>
    <h1 id="headline">Seite nicht gefunden — wir sind nicht mehr zusammen.</h1>
    <p>Diese Version gehört jetzt ins Archiv.</p>
    <p>Manche Kapitel enden, auch wenn sie mal alles waren.</p>
    <p class="status">Status: <strong>Relationship route removed</strong></p>
  </main>
</body>
</html>
